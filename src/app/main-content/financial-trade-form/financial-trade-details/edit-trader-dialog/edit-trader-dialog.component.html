   <div class="trader-detail-card">
    <mat-form-field>
      <mat-label>Date</mat-label>
      <input matInput [(ngModel)]="editedTrader.date">
    </mat-form-field>
    <!-- <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker> -->

        <mat-label>Date</mat-label>

        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>

    <mat-form-field>
      <mat-label>Series Code</mat-label>
      <input matInput [(ngModel)]="editedTrader.seriesCode">
    </mat-form-field>
  
    <mat-form-field>
      <mat-label>Item Name</mat-label>
      <input matInput [(ngModel)]="editedTrader.financialTradeLines[0].itemName">
    </mat-form-field>
  
    <mat-form-field>
      <mat-label>Quantity</mat-label>
      <input matInput [(ngModel)]="editedTrader.financialTradeLines[0].quantity">
    </mat-form-field>
  
    <mat-form-field>
      <mat-label>Price</mat-label>
      <input matInput [(ngModel)]="editedTrader.financialTradeLines[0].price">
    </mat-form-field>
  
    <button mat-flat-button (click)="save()">Save</button>
    <button mat-flat-button class="rmPatient" (click)="cancel()">Cancel</button>
  </div>
