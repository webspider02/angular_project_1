  <div class="trader-detail-card">
  <mat-form-field appearance="fill">
    <mat-label>Date</mat-label>
    <input matInput [matDatepicker]="picker" [(ngModel)]="editedTrader.date" />
    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Series Code</mat-label>
    <input matInput [(ngModel)]="editedTrader.seriesCode" />
  </mat-form-field>

  <mat-form-field>
    <mat-label>Item Name</mat-label>
    <input matInput [(ngModel)]="editedTrader.financialTradeLines[0].itemName" />
  </mat-form-field>

  <mat-form-field>
    <mat-label>Quantity</mat-label>
    <input matInput type="number" [(ngModel)]="editedTrader.financialTradeLines[0].quantity" />
  </mat-form-field>

  <mat-form-field>
    <mat-label>Price</mat-label>
    <input matInput type="number" [(ngModel)]="editedTrader.financialTradeLines[0].price" />
  </mat-form-field>

  <button mat-flat-button color="primary" (click)="save()">Save</button>
  <button id="cancel" mat-flat-button color="warn" (click)="cancel()">Cancel</button>
</div>
